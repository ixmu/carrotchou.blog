<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="keywords" content="胡萝卜周博客">
  <meta name="description" content="软件分享真正领跑者！一直被模仿，未被超越！">
  <meta name="theme-color" content="#f4f1ea">
  <title>胡萝卜周博客 - 免费软件分享平台 | 坚持不易，且行且珍惜！</title>
  <style>
    :root {
      color: #1c2925;
      background-color: #f4f1ea;
      font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", Tahoma, "Hiragino Sans GB", "Microsoft YaHei", STHeiti, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-size: 16px;
      overflow-x: hidden;
      background:
        linear-gradient(135deg, #f4f1ea 0%, #fbfaf7 52%, #e9f0eb 100%);
    }

    header,
    main {
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(100% - 3rem, 68rem);
      margin: 0 auto;
      padding: 2rem 0 1rem;
      box-sizing: border-box;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-mark {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      place-items: center;
      border-radius: 0.75rem;
      color: #fff;
      background-color: #eb742f;
      box-shadow: 0 0.5rem 1.25rem rgba(235, 116, 47, 0.2);
      font-size: 1.1rem;
      font-weight: 800;
    }

    .brand-name {
      margin: 0;
      color: #1c2925;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-tag {
      margin: 0.2rem 0 0;
      color: #708078;
      font-size: 0.75rem;
    }

    nav a {
      display: inline-block;
      padding: 0.65rem 1rem;
      border: 1px solid rgba(42, 102, 81, 0.25);
      border-radius: 999px;
      color: #2a6651;
      background-color: rgba(255, 255, 255, 0.55);
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: #2a6651;
      color: #fff;
      background-color: #2a6651;
      outline: none;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem 4rem;
      box-sizing: border-box;
    }

    figure {
      position: relative;
      margin: 0;
      text-align: center;
    }

    .intro {
      max-width: 36rem;
      margin: 0 auto 1.75rem;
      color: #1c2925;
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.08;
    }

    .intro span {
      color: #eb742f;
    }

    .subtitle {
      max-width: 32rem;
      margin: 0 auto 2.5rem;
      color: #607068;
      line-height: 1.8;
    }

    .qr-frame {
      width: min(72vw, 18rem);
      aspect-ratio: 1;
      margin: 0 auto;
      padding: 0.8rem;
      border: 1px solid rgba(42, 102, 81, 0.16);
      border-radius: 1.5rem;
      background-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 1.5rem 4rem rgba(28, 41, 37, 0.13), 0 0 0 0.45rem rgba(255, 255, 255, 0.38);
      box-sizing: border-box;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      border-radius: 0.9rem;
      object-fit: contain;
      background-color: #fff;
    }

    figcaption {
      margin-top: 1.25rem;
      color: #2a6651;
      font-size: 0.9rem;
      font-weight: 700;
    }

    figcaption::before {
      display: inline-block;
      width: 0.4rem;
      height: 0.4rem;
      margin: 0 0.5rem 0.1rem 0;
      border-radius: 50%;
      background-color: #eb742f;
      content: "";
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 1.5rem;
      border-top: 1px solid rgba(28, 41, 37, 0.1);
      color: #708078;
      font-size: 0.875rem;
      line-height: 1.7;
      text-align: center;
    }

    footer p {
      margin: 0;
    }

    footer p + p {
      margin-top: 0.15rem;
      color: #9a8880;
      font-size: 0.8rem;
    }

    @media (max-width: 40rem) {
      header {
        width: min(100% - 2rem, 68rem);
        padding-top: 1.25rem;
      }

      main {
        padding-top: 2rem;
      }

      .intro {
        font-size: 2.25rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">胡</div>
      <div>
        <h1 class="brand-name">胡萝卜周博客</h1>
        <p class="brand-tag">免费软件分享平台</p>
      </div>
    </div>
    <nav aria-label="主导航">
      <a href="#contact">联系我们</a>
    </nav>
  </header>
  <main>
    <figure>
      <h2 class="intro">发现好软件，<span>让效率更进一步</span></h2>
      <p class="subtitle">软件分享真正领跑者！一直被模仿，未被超越！</p>
      <div class="qr-frame">
        <img src="./carrotchou2.jpg" alt="胡萝卜周博客官方微信二维码">
      </div>
      <figcaption>扫码关注胡萝卜周博客</figcaption>
    </figure>
  </main>
  <footer id="contact">
    <p>版权归属：胡萝卜周博客</p>
    <p>联系方式：微信公众号“胡萝卜周博客”</p>
  </footer>

    gtag('config', 'G-FPTGP6CWZV');
  </script>
</body>
</html>
